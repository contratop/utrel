<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="card-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="arc-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
    <filter id="shadow-floating" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#312e81" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Squircle with rounded corners (macOS / iOS ratio) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#icon-bg)" />

  <!-- Specular Reflection / Frosted rim -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" />
  <rect x="20" y="20" width="472" height="236" rx="108" fill="url(#glass-specular)" />

  <!-- Subtle ambient glow inside -->
  <circle cx="256" cy="200" r="160" fill="#67e8f9" opacity="0.18" filter="url(#glow)" />

  <!-- Center Artwork: The Utrel "U" Kanban Concept -->
  <g filter="url(#shadow-card)">
    <!-- Base U-Curve connecting the columns -->
    <path
      d="M 160 260 C 160 375, 352 375, 352 260"
      fill="none"
      stroke="url(#arc-gradient)"
      stroke-width="58"
      stroke-linecap="round"
    />

    <!-- Left Column Card (To Do / Origin) -->
    <rect x="131" y="145" width="58" height="150" rx="28" fill="url(#card-left)" />

    <!-- Right Column Card (Done / Progress) -->
    <rect x="323" y="180" width="58" height="115" rx="28" fill="url(#card-left)" />
  </g>

  <!-- Central Floating Velocity Card (Active Task / The "Engine") -->
  <g filter="url(#shadow-floating)">
    <rect x="227" y="110" width="58" height="110" rx="26" fill="url(#card-accent)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" />
    <!-- Mini Card detail indicators (Kanban card lines) -->
    <rect x="242" y="138" width="28" height="6" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="242" y="154" width="18" height="6" rx="3" fill="#ffffff" fill-opacity="0.6" />
    <circle cx="264" cy="188" r="4" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- Dot indicator on Right Card (Done state badge) -->
  <circle cx="352" cy="212" r="8" fill="#10b981" />
</svg>
