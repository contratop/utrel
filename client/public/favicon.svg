<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Utrel">
  <defs>
    <linearGradient id="utrel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo: cuadrado con esquinas redondeadas -->
  <rect width="64" height="64" rx="16" fill="url(#utrel-bg)" />

  <!-- Borde interior sutil -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" />

  <!-- «U» geométrica: columnas kanban y tarjeta en movimiento -->
  <g filter="url(#subtle-shadow)">
    <rect x="14" y="16" width="10" height="22" rx="4" fill="url(#card-grad)" />
    <rect x="40" y="20" width="10" height="18" rx="4" fill="url(#card-grad)" />
    <path d="M 19 32 C 19 46, 45 46, 45 32" fill="none" stroke="url(#card-grad)" stroke-width="8" stroke-linecap="round" />
    <rect x="27" y="13" width="10" height="14" rx="3.5" fill="url(#accent-grad)" stroke="#ffffff" stroke-width="1.2" />
  </g>
</svg>
